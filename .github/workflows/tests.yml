name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} / PHPUnit ${{ matrix.phpunit }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        phpunit: ['11']
        include:
          - php: '8.4'
            phpunit: '12'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xml, xmlwriter
          coverage: none
          tools: composer:v2
      - name: Validate Composer configuration
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Install PHPUnit 12
        if: matrix.phpunit == '12'
        run: composer update phpunit/phpunit --with 'phpunit/phpunit:^12.0' --with-dependencies --no-interaction --prefer-dist --no-progress
      - name: Run pQuery adapter tests
        run: composer test:pquery
      - name: Run tag processor adapter tests
        run: composer test:tag-processor
      - name: Run tests in random order
        run: composer test -- --order-by=random --random-order-seed=42
      - name: Run against WordPress 7.1.3 core APIs
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/wp71"
          curl --fail --silent --show-error --retry 3 https://wordpress.org/wordpress-7.1.3.tar.gz | tar -xz -C "$RUNNER_TEMP/wp71"
          WP_TESTS_CORE_PATH="$RUNNER_TEMP/wp71/wordpress" composer test
